# Local deployment of the whole platform:
#
#   docker compose up --build -d
#   docker compose exec api aquasph-admin tenant create demo
#   docker compose exec api aquasph-admin key create demo      # prints the key once
#
# Then point aquactl at http://localhost:8080. The credentials below are
# for this local stack only.
name: aquasph

x-common-env: &common-env
  AQUASPH_DATABASE_URL: postgres://aquasph:aquasph-local@postgres:5432/aquasph?sslmode=disable
  AQUASPH_REDIS_URL: redis://redis:6379/0
  AQUASPH_LOG_FORMAT: json

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aquasph
      POSTGRES_PASSWORD: aquasph-local
      POSTGRES_DB: aquasph
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquasph -d aquasph"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    # Rate-limit state and progress fan-out are both disposable: nothing
    # in Redis is the only copy of anything (TRD section 1).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      args:
        GIT_REV: ${GIT_REV:-unknown}
    image: aquasph:local
    command: ["aquasph-api"]
    environment:
      <<: *common-env
    ports: ["8080:8080"]
    volumes: [artifacts:/var/lib/aquasph/artifacts]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "aquasph-api", "healthcheck"]
      interval: 3s
      timeout: 4s
      retries: 20

  worker:
    image: aquasph:local
    command: ["aquasph-worker"]
    # The worker is not an init process. With init: true, tini is PID 1
    # and reaps any orphaned solver zombie; without it they accumulate
    # (observed in the failure-injection run, docs/platform/runbook.md).
    init: true
    environment:
      <<: *common-env
      AQUASPH_WORKER_CONCURRENCY: "1"
      AQUASPH_SOLVER_THREADS: "2"
    volumes: [artifacts:/var/lib/aquasph/artifacts]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "aquasph-worker", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 10
    # Longer than AQUASPH_DRAIN_TIMEOUT (20s default): Docker's default of
    # 10s would SIGKILL a worker mid-drain and turn every deploy into a
    # batch of lease expiries.
    stop_grace_period: 30s
    deploy:
      replicas: 2

volumes:
  pgdata: {}
  artifacts: {}

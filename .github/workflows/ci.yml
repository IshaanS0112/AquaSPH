name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMP (macOS)
        # Apple Clang does not ship OpenMP, and CMakeLists.txt declares
        # find_package(OpenMP REQUIRED), so configure fails without libomp.
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Configure
        # Visualization stays OFF here on purpose, and the "GL-free build"
        # step below is what proves that is a real property rather than a
        # default nobody checks: aquasph_view needs the X11 development
        # headers GLFW's own CMake requires at configure time, and the
        # headless binary plus every test target links neither GL nor GLFW.
        #
        # macOS needs explicit OpenMP flags, not just an OpenMP_ROOT hint:
        # Homebrew's libomp is keg-only, and CMake's FindOpenMP couldn't
        # locate its flags/library from OpenMP_ROOT alone when this was
        # tested directly on real Apple Silicon hardware (AppleClang 21,
        # CMake 4.4.2) -- see the "macOS" note under Build in README.md.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DAQUASPH_BUILD_TESTS=ON \
              -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include" \
              -DOpenMP_CXX_LIB_NAMES="omp" \
              -DOpenMP_omp_LIBRARY="$(brew --prefix libomp)/lib/libomp.dylib"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DAQUASPH_BUILD_TESTS=ON
          fi

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        # Includes the bit-identical-across-1/2/4/8-threads determinism
        # tests and the boundary-leakage test, which are the two properties
        # most likely to be broken silently by an otherwise-reasonable
        # change.
        run: ctest --test-dir build --output-on-failure

      - name: GL-free headless build
        # The claim is that the solver never depends on the renderer. This
        # asserts it mechanically rather than by convention: if any core or
        # scene source ever includes a GL header or references a GLFW
        # symbol, `nm` finds it here.
        if: runner.os == 'Linux'
        run: |
          set -e
          if ldd build/aquasph | grep -Eiq 'libGL|libglfw|libX11'; then
            echo "FAIL: the headless binary links a graphics library." >&2
            ldd build/aquasph >&2
            exit 1
          fi
          if nm -uC build/aquasph | grep -Eiq 'glfw|glCreateProgram'; then
            echo "FAIL: the headless binary references GL/GLFW symbols." >&2
            exit 1
          fi
          echo "OK: aquasph links no graphics library and references no GL symbols."

      - name: Scenario smoke tests
        # A solver that builds, passes its unit tests, and then diverges on
        # a real scenario is still broken. This runs every scenario in the
        # library for a short slice of simulated time at the development
        # resolution and fails if any reports UNSTABLE.
        #
        # Short --time, not short --steps: with an adaptive timestep, a
        # fixed step count covers a different amount of physics at each
        # resolution, so a wall-clock budget expressed in steps would
        # silently test less as the solver got faster.
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          fail=0
          for f in configs/scenarios/*.json; do
            name=$(basename "$f" .json)
            printf '%-24s' "$name"
            if ./build/aquasph --scenario "$name" --quality low --time 0.15 \
                 --threads 2 --metrics "/tmp/$name.json" --quiet > "/tmp/$name.log" 2>&1; then
              echo "STABLE"
            else
              echo "UNSTABLE"
              tail -n 20 "/tmp/$name.log"
              fail=1
            fi
          done
          exit $fail

      - name: Metrics are valid JSON and carry their provenance
        # The metrics file is what makes a scenario an experiment rather
        # than an animation, so it is checked like an interface.
        if: runner.os == 'Linux'
        run: python3 scripts/check_metrics.py '/tmp/*.json'

      - name: Warning-free build
        # -Wall -Wextra are on for the whole project; this makes a new
        # warning a failure rather than something to scroll past.
        if: runner.os == 'Linux'
        run: |
          rm -rf build-warn
          cmake -B build-warn -DCMAKE_BUILD_TYPE=Release -DAQUASPH_BUILD_TESTS=OFF \
                -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build-warn --parallel

  backend:
    name: Platform (Go) against real Postgres and Redis
    runs-on: ubuntu-latest
    # Integration tests run against real services, not mocks: the queue's
    # correctness is SQL locking behaviour (SKIP LOCKED, row locks, READ
    # COMMITTED re-checks) that no mock reproduces.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      AQUASPH_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      AQUASPH_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      # Missing services or a missing solver fail the job instead of
      # silently skipping the tests that need them.
      AQUASPH_REQUIRE_INTEGRATION: "1"
      AQUASPH_REQUIRE_SOLVER: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build the solver the worker runs
        working-directory: ${{ github.workspace }}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DAQUASPH_BUILD_TESTS=OFF
          cmake --build build --target aquasph --parallel

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: go vet
        run: go vet ./...

      - name: Unit and integration tests (race detector)
        run: go test -race -short -count=1 ./...

      - name: End-to-end with failure injection
        # Real binaries, the real solver, workers SIGKILLed and SIGTERMed
        # mid-job. See backend/e2e/e2e_test.go.
        run: go test -count=1 -timeout 15m -v ./e2e/

  container:
    name: Container image and Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --build-arg GIT_REV="${GITHUB_SHA::7}" -t aquasph:local .

      - name: Solver runs inside the image
        run: |
          docker run --rm aquasph:local aquasph \
            --scenario /opt/aquasph/scenarios/dam_break.json \
            --quality low --time 0.02 --threads 2 --progress-json --metrics /tmp/m.json \
            | tail -1 | grep '"status":"STABLE"'

      - name: Whole stack runs a job end to end
        # Exactly the quick start in README.md: compose up, mint a key,
        # submit a job over HTTP, wait for the real solver to finish it.
        run: |
          set -eu
          docker compose up -d --no-build --wait
          docker compose exec -T api aquasph-admin tenant create ci
          KEY=$(docker compose exec -T api aquasph-admin key create ci 2>/dev/null | tr -d '\r')
          ID=$(curl -fsS -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
                 -d '{"scenario":"dam_break","quality":"low","sim_time":0.05}' \
                 http://localhost:8080/v1/jobs | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 120); do
            STATE=$(curl -fsS -H "Authorization: Bearer $KEY" http://localhost:8080/v1/jobs/$ID \
                      | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')
            [ "$STATE" = completed ] && break
            case "$STATE" in failed|cancelled) echo "job $STATE"; exit 1 ;; esac
            sleep 1
          done
          [ "$STATE" = completed ]
          curl -fsS -H "Authorization: Bearer $KEY" http://localhost:8080/v1/jobs/$ID/result | grep '"STABLE"'

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 200
